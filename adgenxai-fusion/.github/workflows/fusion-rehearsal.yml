name: Fusion Rehearsal

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      context:
        description: 'Rehearsal context'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - staging
          - production

env:
  CONTEXT: ${{ github.event.inputs.context || 'ci' }}
  NOTIFY: true

jobs:
  rehearsal:
    name: AdgenxAI Fusion v2 Rehearsal
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🔧 Create environment file
      run: |
        echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
        echo "SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}" >> .env
        echo "PORT=8000" >> .env
        echo "CONTEXT=${{ env.CONTEXT }}" >> .env
        echo "NOTIFY=${{ env.NOTIFY }}" >> .env
        
    - name: 🐳 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 🎭 Run Fusion Rehearsal
      run: |
        chmod +x rehearse.sh
        bash rehearse.sh
        
    - name: 🐳 Test Docker Build
      run: |
        docker build -t adgenxai-fusion:ci .
        
    - name: 🐳 Test Docker Compose
      run: |
        docker compose -f docker-compose.yml config
        
    - name: 📊 Upload rehearsal logs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: fusion-rehearsal-logs-${{ env.CONTEXT }}
        path: |
          logs/
          !logs/.gitkeep
        retention-days: 30
        
    - name: 📋 Upload rehearsal report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: fusion-rehearsal-report-${{ env.CONTEXT }}
        path: logs/rehearsal_report_*.json
        retention-days: 30
        
    - name: 🔔 Notify on failure
      if: failure() && env.NOTIFY == 'true'
      run: |
        if [ ! -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ AdgenxAI Fusion v2 Rehearsal Failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "❌ Fusion v2 Rehearsal Failed"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Context:* ${{ env.CONTEXT }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Branch:* ${{ github.ref_name }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:* ${{ github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                    }
                  ]
                }
              ]
            }'
        fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: rehearsal
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔍 Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: 📊 Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'