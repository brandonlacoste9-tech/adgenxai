version: '3.8'

services:
  fusion:
    build: .
    ports:
      - "8000:8000"
    environment:
      - CONTEXT=docker
      - PORT=8000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./speech:/app/speech
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rehearsal:
    build: .
    environment:
      - CONTEXT=rehearsal
      - NOTIFY=true
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./speech:/app/speech
    command: ["bash", "rehearse.sh"]
    depends_on:
      - fusion

volumes:
  logs:
  speech: