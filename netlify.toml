# netlify.toml - NETLIFY DEPLOYMENT CONFIGURATION FOR ADGENXAI
# Complete production-ready configuration for Next.js 16 with Netlify

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_VERSION = "10"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify Functions Configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "express"]

# Next.js Plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# API Routes Redirects
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA Fallback for Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Static Asset Caching
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API Response Headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/json"

# Dashboard Pages - Require Authentication (configure in Netlify UI)
[[headers]]
  for = "/dashboard/*"
  [headers.values]
    Cache-Control = "private, no-cache, no-store, must-revalidate"

# Environment-specific settings
[context.production.environment]
  NODE_ENV = "production"
  ENABLE_TELEMETRY = "true"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  ENABLE_TELEMETRY = "false"

[context.branch-deploy.environment]
  NODE_ENV = "development"
  ENABLE_TELEMETRY = "false"

# Dev Server Configuration
[dev]
  command = "npm run dev"
  port = 3000
  publish = ".next"